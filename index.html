<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchiDraft AI</title>
    <!-- Tailwind CSS for smooth mobile UI -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gray-800 p-4 shadow-md text-center border-b border-gray-700">
        <h1 class="text-xl font-bold tracking-wide text-amber-400">📐 ArchiDraft AI Assistant</h1>
        <p class="text-xs text-gray-400 mt-1">Your Mobile Architectural Design & Drafting Partner</p>
    </header>

    <!-- Settings Drawer (Hidden by default, used for entering API key securely on your phone) -->
    <div id="settings-panel" class="bg-gray-800 p-4 border-b border-gray-700 text-sm hidden">
        <label class="block text-gray-300 font-medium mb-1">OpenAI API Key:</label>
        <input id="api-key-input" type="password" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white placeholder-gray-500 focus:outline-none focus:border-amber-400" placeholder="sk-...">
        <p class="text-xs text-gray-500 mt-1">Your key is stored safely only on your phone's browser storage.</p>
    </div>

    <!-- Main Output Area -->
    <main class="flex-1 p-4 overflow-y-auto max-w-2xl mx-auto w-full space-y-4" id="chat-output">
        <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 shadow-sm">
            <p class="text-amber-400 font-bold mb-1">System ready</p>
            <p class="text-sm text-gray-300">Tap the ⚙️ icon below to input your API key. Once added, ask for sketch help, perspective steps, or concept alternatives!</p>
        </div>
    </main>

    <!-- Quick Tool Suggestions Menu -->
    <div class="px-4 py-2 max-w-2xl mx-auto w-full overflow-x-auto flex space-x-2 text-xs whitespace-nowrap scrollbar-none">
        <button onclick="quickPrompt('Help me draw a 2-point perspective house step-by-step')" class="bg-gray-800 hover:bg-gray-700 border border-gray-600 rounded-full px-3 py-1 text-gray-300 transition">🏠 Perspective House</button>
        <button onclick="quickPrompt('Give me 3 minimalist concept alternatives for a small urban café')" class="bg-gray-800 hover:bg-gray-700 border border-gray-600 rounded-full px-3 py-1 text-gray-300 transition">☕ Café Concepts</button>
        <button onclick="quickPrompt('What are common drafting mistakes when drawing a residential floor plan section?')" class="bg-gray-800 hover:bg-gray-700 border border-gray-600 rounded-full px-3 py-1 text-gray-300 transition">⚠️ Plan Mistakes</button>
    </div>

    <!-- Input Action Bar -->
    <footer class="bg-gray-800 border-t border-gray-700 p-3 sticky bottom-0">
        <div class="max-w-2xl mx-auto flex items-center space-x-2">
            <button onclick="toggleSettings()" class="bg-gray-700 hover:bg-gray-600 text-lg p-2 rounded-lg transition" title="Settings">⚙️</button>
            <input id="user-input" type="text" class="flex-1 bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white placeholder-gray-400 focus:outline-none focus:border-amber-400 text-sm" placeholder="Ask for architectural guidance...">
            <button onclick="sendMessage()" class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold px-4 py-2.5 rounded-lg transition text-sm">Send</button>
        </div>
    </footer>

    <!-- App Engine Script Logic -->
    <script>
        // System instructions to match your layout/criticism behavior goals
        const SYSTEM_PROMPT = `You are an expert architecture drawing and design assistant. Always respond in this structured format:
1) What I understand: (brief recap)
2) Clarifying questions (only if needed): (max 3)
3) Design/drawing guidance: (step-by-step instructions)
4) Checklist: (drawing/labeling/materials metrics)
5) Common mistakes + fixes:
6) Next action: (one concrete task the user can do immediately on paper or app)`;

        // Load saved API key on startup
        window.onload = () => {
            const savedKey = localStorage.getItem('archi_api_key');
            if(savedKey) document.getElementById('api-key-input').value = savedKey;
        };

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('hidden');
        }

        function quickPrompt(text) {
            document.getElementById('user-input').value = text;
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const keyField = document.getElementById('api-key-input');
            const outputArea = document.getElementById('chat-output');
            
            const prompt = inputField.value.trim();
            const apiKey = keyField.value.trim();

            if (!prompt) return;
            if (!apiKey) {
                alert("Please tap the ⚙️ icon and enter your OpenAI API key first.");
                return;
            }

            // Save key for future convenience
            localStorage.setItem('archi_api_key', apiKey);
            inputField.value = '';

            // Render User Prompt block
            outputArea.innerHTML += `
                <div class="bg-gray-700/50 border border-gray-600 rounded-lg p-4 shadow-sm self-end">
                    <p class="text-xs text-amber-400 font-semibold mb-1">You</p>
                    <p class="text-sm text-gray-100">${prompt}</p>
                </div>
            `;
            
            // Render Loading Placeholder
            const loadingId = 'loading-' + Date.now();
            outputArea.innerHTML += `
                <div id="${loadingId}" class="bg-gray-800 border border-gray-700 rounded-lg p-4 shadow-sm animate-pulse">
                    <p class="text-xs text-gray-400">Architect Assistant is calculating...</p>
                </div>
            `;
            outputArea.scrollTop = outputArea.scrollHeight;

            try {
                // Call standard openAI endpoints directly via frontend securely using user's own token
                const response = await fetch('https://openai.com', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini', // Lightweight, incredibly fast, and very smart with design schemas
                        messages: [
                            { role: 'system', content: SYSTEM_PROMPT },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                // Render formatted AI markdown block response
                const aiReply = data.choices[0].message.content.replace(/\n/g, '<br>');
                outputArea.innerHTML += `
                    <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 shadow-sm">
                        <p class="text-xs text-amber-400 font-semibold mb-2">📐 ArchiDraft AI</p>
                        <div class="text-sm text-gray-200 leading-relaxed">${aiReply}</div>
                    </div>
                `;

            } catch (err) {
                document.getElementById(loadingId).remove();
                outputArea.innerHTML += `
                    <div class="bg-red-900/50 border border-red-700 rounded-lg p-4 shadow-sm text-red-200 text-sm">
                        <strong>Error connecting to AI engine:</strong> ${err.message}
                    </div>
                `;
            }
            outputArea.scrollTop = outputArea.scrollHeight;
        }
    </script>
</body>
          </html>
