  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchiDraft AI</title>
    <!-- Embedded styling so it looks great even if script is blocked -->
    <style>
        body { background-color: #111827; color: #f3f4f6; font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #1f2937; padding: 15px; text-align: center; border-bottom: 1px solid #374151; }
        h1 { margin: 0; font-size: 1.25rem; color: #fbbf24; }
        .subtitle { font-size: 0.75rem; color: #9ca3af; margin-top: 4px; }
        #settings-panel { background-color: #1f2937; padding: 15px; border-bottom: 1px solid #374151; font-size: 0.875rem; }
        input[type="password"], input[type="text"] { width: 100%; bg-color: #374151; border: 1px solid #4b5563; border-radius: 6px; padding: 10px; color: white; box-sizing: border-box; background: #374151; }
        main { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .card { background-color: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 15px; }
        .user-msg { background-color: #2d3748; border: 1px solid #4a5568; border-radius: 8px; padding: 15px; align-self: flex-end; width: 90%; }
        .pill-container { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; white-space: nowrap; }
        .pill { background: #1f2937; border: 1px solid #4b5563; padding: 6px 12px; border-radius: 20px; color: #d1d5db; font-size: 0.75rem; cursor: pointer; }
        footer { background-color: #1f2937; border-t: 1px solid #374151; padding: 12px; position: sticky; bottom: 0; }
        .input-group { display: flex; gap: 8px; align-items: center; }
        .btn { background-color: #f59e0b; color: #111827; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-settings { background: #4b5563; font-size: 1.2rem; padding: 8px; border-radius: 6px; border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>📐 ArchiDraft AI Assistant</h1>
        <div class="subtitle">Powered by Google Gemini</div>
    </header>

    <div id="settings-panel">
        <label style="display:block; margin-bottom:5px; font-weight:bold;">Gemini API Key:</label>
        <input id="api-key-input" type="password" placeholder="AIzaSy...">
        <p style="font-size:0.75rem; color:#9ca3af; margin: 5px 0 0 0;">Get a free key from Google AI Studio. Stored locally on your phone.</p>
    </div>

    <main id="chat-output">
        <div class="card">
            <p style="color:#fbbf24; font-weight:bold; margin-top:0;">System Ready</p>
            <p style="font-size:0.875rem; margin-bottom:0;">Paste your Gemini key below. Then tap a tool shortcut or type a drafting question!</p>
        </div>
    </main>

    <div class="pill-container">
        <button onclick="quickPrompt('Help me draw a 2-point perspective house step-by-step')" class="pill">🏠 Perspective House</button>
        <button onclick="quickPrompt('Give me 3 minimalist concept alternatives for a small urban café')" class="pill">☕ Café Concepts</button>
        <button onclick="quickPrompt('What are common drafting mistakes when drawing a residential floor plan section?')" class="pill">⚠️ Plan Mistakes</button>
    </div>

    <footer>
        <div class="input-group">
            <button onclick="toggleSettings()" class="btn-settings">⚙️</button>
            <input id="user-input" type="text" placeholder="Ask for architectural guidance...">
            <button onclick="sendMessage()" class="btn">Send</button>
        </div>
    </footer>

    <script>
        const SYSTEM_PROMPT = `You are an expert architecture drawing and design assistant. Always respond in this structured format:
1) What I understand: (brief recap)
2) Clarifying questions (only if needed): (max 3)
3) Design/drawing guidance: (step-by-step instructions)
4) Checklist: (drawing/labeling/materials metrics)
5) Common mistakes + fixes:
6) Next action: (one concrete task user can do right now)`;

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) document.getElementById('api-key-input').value = savedKey;
        };

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function quickPrompt(text) {
            document.getElementById('user-input').value = text;
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const keyField = document.getElementById('api-key-input');
            const outputArea = document.getElementById('chat-output');
            
            const prompt = inputField.value.trim();
            const apiKey = keyField.value.trim();

            if (!prompt) return;
            if (!apiKey) {
                alert("Please enter your Gemini API key first.");
                return;
            }

            localStorage.setItem('gemini_api_key', apiKey);
            inputField.value = '';

            outputArea.innerHTML += `
                <div class="user-msg">
                    <p style="font-size:0.75rem; color:#fbbf24; margin:0 0 4px 0;">You</p>
                    <p style="margin:0; font-size:0.875rem;">${prompt}</p>
                </div>
            `;
            
            const loadingId = 'loading-' + Date.now();
            outputArea.innerHTML += `
                <div id="${loadingId}" class="card">
                    <p style="font-size:0.75rem; color:#9ca3af; margin:0;">Architect Assistant is processing...</p>
                </div>
            `;
            outputArea.scrollTop = outputArea.scrollHeight;

            try {
                // Call Google Gemini API directly (Allows CORS requests seamlessly from browsers)
                const url = `https://googleapis.com{apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: SYSTEM_PROMPT + "\n\nUser Question: " + prompt }]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (!response.ok) {
                    throw new Error(data.error?.message || "API Error");
                }

                let aiReply = data.candidates[0].content.parts[0].text;
                aiReply = aiReply.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                outputArea.innerHTML += `
                    <div class="card">
                        <p style="font-size:0.75rem; color:#fbbf24; margin:0 0 8px 0;">📐 ArchiDraft AI</p>
                        <div style="font-size:0.875rem; line-height:1.5;">${aiReply}</div>
                    </div>
                `;

            } catch (err) {
                if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                outputArea.innerHTML += `
                    <div class="card" style="border-color:#ef4444; color:#fca5a5;">
                        <strong>Error:</strong> ${err.message}
                    </div>
                `;
            }
            outputArea.scrollTop = outputArea.scrollHeight;
        }
    </script>
</body>
                </html>
